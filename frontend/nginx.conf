server {
    listen 80;
    server_name _;
    client_max_body_size 15m;

    # DNS de Docker + variable: "backend" se resuelve en cada petición (caché
    # 10 s). Con un upstream fijo, Nginx guarda la IP del arranque y da 502 en
    # cuanto el contenedor del backend se recrea.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /admin/ {
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass $backend;
        expires 7d;
    }

    # Volumen compartido con backend/worker (montado en solo lectura).
    location /media/ {
        alias /srv/media/;
        expires 7d;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
