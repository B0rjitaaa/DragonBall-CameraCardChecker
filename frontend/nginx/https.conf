# HTTPS con el certificado de la CA local (scripts/local-https.sh). Lo activa
# /docker-entrypoint.d/40-https.sh solo si existen los certificados.
# Hace falta para que el navegador del móvil permita usar la cámara en directo.
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:1m;

    include /etc/nginx/snippets/app.conf;
}
